name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew test --offline || ./gradlew test
NOTE: CI uses the Gradle wrapper once added; first build session should add gradle/wrapper (gradle wrapper --gradle-version 8.8) or switch CI to a system Gradle.
